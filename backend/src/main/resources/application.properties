# =============================================
# RankGrade Backend - Application Configuration
# =============================================

spring.application.name=rankgrade-backend
server.port=8080

# =============================================
# Database Configuration (MySQL 8)
# =============================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/rankgrade_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:neeraj}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000

# =============================================
# JPA / Hibernate
# =============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# =============================================
# JWT Configuration
# =============================================
app.jwt.secret=${JWT_SECRET:RankGrade2024VeryLongSecretKeyForJWTGenerationThatIsAtLeast256BitsLong}
app.jwt.expiration.ms=${JWT_EXPIRATION_MS:86400000}
app.jwt.refresh.expiration.ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# =============================================
# CORS Configuration
# =============================================
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200}

# =============================================
# Multipart File Upload
# =============================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# =============================================
# Logging
# =============================================
logging.level.com.rankgrade=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
